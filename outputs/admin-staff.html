<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Staff permissions — Admin</title><style>:root{--bg:#0b0b29;--card:#171642;--ink:#f5f3ff;--muted:#aaa9cb;--line:#39356b;--violet:#8977ff;--green:#55d9a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:#b6acff;text-decoration:none}.hero{padding:48px 0 25px}.hero h1{font-size:42px;margin:0}.hero p,p{color:var(--muted)}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;padding-bottom:70px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px}h2{margin-top:0}label{display:block;margin:12px 0 6px}input,button{font:inherit}input[type=text],input[type=email]{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0e0d31;color:white}button{border:0;border-radius:9px;padding:11px 14px;background:var(--violet);color:white;font-weight:750;cursor:pointer}.staff{margin-bottom:14px}.staff-head{display:flex;justify-content:space-between;gap:15px}.badge{font-size:11px;color:var(--green)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.batches{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 17px}.batches label{margin:0;padding:7px 9px;background:#0f0e32;border-radius:8px;font-size:12px}.classes{grid-column:1/-1}.class-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.class-row div{flex:1}.danger{background:#8c3858}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}.checks{grid-template-columns:1fr}}</style></head><body><header class="wrap"><a href="/admin">← Admissions admin</a><strong>Owner controls</strong></header><main class="wrap"><section class="hero"><h1>Teachers and class permissions</h1><p>Only the two protected owner accounts can use this page.</p></section><section class="grid"><form class="card" id="invite"><h2>Add teacher</h2><label for="name">Teacher name</label><input id="name" type="text" required><label for="email">Teacher email</label><input id="email" type="email" required><button style="margin-top:16px">Send secure invitation</button><p id="inviteStatus"></p></form><div class="card"><h2>Staff access</h2><div id="staff">Loading…</div></div><div class="card classes"><h2>Online-class restrictions</h2><div id="classes">Loading…</div></div></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let data;async function api(url,options={}){const r=await fetch(url,options),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}function render(){document.getElementById('staff').innerHTML=data.staff.map(u=>`<article class="staff"><div class="staff-head"><div><b>${esc(u.name)}</b><p>${esc(u.email)} · ${esc(u.role)}</p></div><span class="badge">${u.protectedAccount?'PROTECTED OWNER':u.requiresPasswordSetup?'INVITED':'ACTIVE'}</span></div>${u.role==='teacher'?`<div class="checks">${[['manageLiveClasses','Schedule live classes'],['manageHomework','Create homework'],['manageMaterials','Upload materials'],['gradeSubmissions','Grade submissions']].map(([k,l])=>`<label><input type="checkbox" data-user="${u.id}" data-key="${k}" ${u.permissions?.[k]?'checked':''}> ${l}</label>`).join('')}<label><input type="checkbox" data-user="${u.id}" data-key="suspended" ${u.suspended?'checked':''}> Suspend account</label></div><b>Assigned batches</b><div class="batches">${data.batches.map(b=>`<label><input type="checkbox" data-user="${u.id}" data-batch="${b.id}" ${u.permissions?.allowedBatchIds?.includes(b.id)?'checked':''}> ${esc(b.name)}</label>`).join('')}</div><button onclick="save('${u.id}')">Save permissions</button>`:''}</article>`).join('')}async function save(id){const boxes=[...document.querySelectorAll(`[data-user="${id}"]`)],payload={};for(const key of ['manageLiveClasses','manageHomework','manageMaterials','gradeSubmissions','suspended'])payload[key]=Boolean(boxes.find(x=>x.dataset.key===key)?.checked);payload.allowedBatchIds=boxes.filter(x=>x.dataset.batch&&x.checked).map(x=>x.dataset.batch);await api('/api/admin/staff/'+id+'/permissions',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});alert('Teacher permissions saved.')}async function load(){data=await api('/api/admin/staff');render();const classes=await api('/api/admin/live-classes');document.getElementById('classes').innerHTML=classes.length?classes.map(c=>`<div class="class-row"><div><b>${esc(c.title)}</b><p>${esc(c.batchName)} · ${new Date(c.startsAt).toLocaleString()}</p>${c.restricted?`<small>${esc(c.restrictionReason)}</small>`:''}</div><button class="${c.restricted?'':'danger'}" onclick="restrictClass('${c.id}',${!c.restricted})">${c.restricted?'Restore':'Restrict'}</button></div>`).join(''):'<p>No live classes scheduled.</p>'}async function restrictClass(id,restricted){const reason=restricted?prompt('Reason for restricting this class:','Restricted by academy owner')||'Restricted by academy owner':'';await api('/api/admin/live-classes/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({restricted,reason})});load()}document.getElementById('invite').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('inviteStatus');status.textContent='Sending…';try{const result=await api('/api/admin/staff/invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value})});status.textContent=result.delivered?'Invitation sent.':'Invitation created; email delivery is not configured.';e.target.reset();load()}catch(error){status.textContent=error.message}};load().catch(error=>document.getElementById('staff').textContent=error.message);</script></body></html>
