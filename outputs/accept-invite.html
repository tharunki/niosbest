<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Set up staff account</title><style>:root{color-scheme:dark}body{margin:0;background:#0b0b29;color:#f5f3ff;font:16px/1.55 system-ui;display:grid;min-height:100vh;place-items:center}.card{width:min(440px,calc(100% - 34px));padding:30px;border-radius:22px;background:#171642;border:1px solid #3b376c}h1{margin-top:0}p{color:#aaa9cb}label{display:block;margin:15px 0 7px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font:inherit}input{background:#0f0e32;border:1px solid #494477;color:white}button{margin-top:18px;border:0;background:#8977ff;color:white;font-weight:800;cursor:pointer}.password{position:relative}.password button{position:absolute;right:7px;top:-11px;width:auto;background:transparent;padding:10px}#status{min-height:24px}</style></head><body><main class="card"><h1>Create your staff password</h1><p>This single-use invitation expires after 24 hours.</p><form id="form"><label for="password">New password</label><div class="password"><input id="password" type="password" minlength="12" required autocomplete="new-password"><button type="button" id="eye" aria-label="Show password">◉</button></div><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" required autocomplete="new-password"><button>Activate account</button></form><p id="status" role="status"></p></main><script>const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('form'),status=document.getElementById('status'),password=document.getElementById('password');document.getElementById('eye').onclick=()=>{password.type=password.type==='password'?'text':'password'};form.onsubmit=async e=>{e.preventDefault();if(password.value!==document.getElementById('confirm').value){status.textContent='Passwords do not match.';return}status.textContent='Activating…';const r=await fetch('/api/auth/accept-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:password.value})}),data=await r.json();if(!r.ok){status.textContent=data.error||'Activation failed.';return}status.textContent='Account activated. Redirecting to sign in…';setTimeout(()=>location.href='/login',900)};</script></body></html>
