<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Batch material access — Admin</title><style>:root{--bg:#0b0b29;--card:#171642;--ink:#f5f3ff;--muted:#aaa9cb;--line:#39356b;--violet:#8977ff;--green:#55d9a0;--red:#ef7695}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:#b6acff;text-decoration:none}.hero{padding:48px 0 24px}.hero h1{margin:0;font-size:42px}.hero p,p{color:var(--muted)}.list{display:grid;gap:12px;padding-bottom:70px}.item{display:flex;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:17px;background:var(--card)}.item div{flex:1}.item b,.item small{display:block}.item small{color:var(--muted);margin-top:4px}.state{font-size:11px;color:var(--green)}button{border:0;border-radius:9px;padding:10px 13px;background:var(--violet);color:white;font:inherit;font-weight:750;cursor:pointer}.restrict{background:#8c3858}.empty{padding:25px;border:1px dashed var(--line);color:var(--muted);border-radius:14px}@media(max-width:650px){.hero h1{font-size:34px}.item{align-items:flex-start;flex-direction:column}}</style></head><body><header class="wrap"><a href="/admin">← Admissions admin</a><a href="/admin/batches">Edit batches</a></header><main class="wrap"><section class="hero"><h1>Batch material access</h1><p>Hide or restore any teacher-uploaded material. Restricted files disappear from the Student Desk and cannot be downloaded through the student API.</p></section><section class="list" id="list"><div class="empty">Loading materials…</div></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(url,options={}){const r=await fetch(url,options),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}function render(items){document.getElementById('list').innerHTML=items.length?items.map(item=>`<article class="item"><div><b>${esc(item.title)}</b><small>${esc(item.batchName)} · ${esc(item.subjectCode)} ${esc(item.subject)} · ${esc(item.materialType)}</small>${item.restricted?`<small>Reason: ${esc(item.restrictionReason)}</small>`:''}</div><span class="state">${item.restricted?'RESTRICTED':'STUDENT ACCESS ON'}</span><button class="${item.restricted?'':'restrict'}" onclick="changeAccess('${item.id}',${!item.restricted})">${item.restricted?'Restore access':'Restrict access'}</button></article>`).join(''):'<div class="empty">No teacher-uploaded batch material is available yet.</div>'}async function load(){try{render(await api('/api/admin/materials'))}catch(error){document.getElementById('list').innerHTML='<div class="empty">'+esc(error.message)+'</div>'}}async function changeAccess(id,restricted){const reason=restricted?(prompt('Reason for restricting this material:','Restricted by academy admin')||'Restricted by academy admin'):'';try{await api('/api/admin/materials/'+encodeURIComponent(id)+'/access',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({restricted,reason})});load()}catch(error){alert(error.message)}}load();</script></body></html>
