<!doctype html><html lang="en"><meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource PDFs — Admin</title>
<style>body{background:#0c0c29;color:white;font:16px/1.6 system-ui}main{max-width:650px;margin:50px auto;padding:24px;background:#201e52;border-radius:18px}a{color:#b6acff}select,input,button{display:block;margin:15px 0;padding:12px;width:100%;box-sizing:border-box}button{background:#8977ff;color:white;border:0;border-radius:9px}</style>
<main><a href="/admin">← Admin admissions</a><h1>Publish subject PDFs</h1><p>Solved TMA ₹249 · Study material ₹499 · PYQs ₹399. Upload only PDFs you are authorized to sell. Purchases do not grant batch access.</p><form id="form"><label for="product">Subject resource</label><select id="product"></select><label for="pdf">PDF (up to 6 MB)</label><input id="pdf" type="file" accept="application/pdf" required><button>Upload PDF</button></form><p id="status" role="status"></p></main>
<script>
const select=document.getElementById('product'),statusText=document.getElementById('status');
async function load(){const session=await fetch('/api/auth/me');const data=await session.json();if(!session.ok||data.user.role!=='admin'){location.href='/login';return}const products=await(await fetch('/api/store/catalogue')).json();for(const p of products){const option=document.createElement('option');option.value=p.id;option.textContent=p.title+' — ₹'+p.price+(p.available?' (uploaded)':'');select.append(option)}}
document.getElementById('form').onsubmit=async event=>{event.preventDefault();const file=document.getElementById('pdf').files[0];if(!file||file.size>6*1024*1024){statusText.textContent='Choose a PDF up to 6 MB.';return}statusText.textContent='Uploading…';try{const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const r=await fetch('/api/store/files/'+encodeURIComponent(select.value),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({fileName:file.name,mimeType:'application/pdf',base64})});const data=await r.json();if(!r.ok)throw new Error(data.error);statusText.textContent='PDF uploaded. This subject resource is now available for purchase.'}catch(e){statusText.textContent=e.message}};
load().catch(e=>statusText.textContent=e.message);
</script></html>
